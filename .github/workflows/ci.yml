name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Format and portable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test portable workspace code
        run: cargo test --locked --workspace

  windows-gnu:
    name: Build Windows GNU binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64 tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64
      - name: Install Rust Windows GNU target
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable
      - name: Build workspace
        run: cargo build --locked --workspace --target x86_64-pc-windows-gnu

  windows-native:
    name: Compile Windows platform code and MSVC resources
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Locate Windows SDK resource compiler
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $rc = Get-ChildItem -LiteralPath $sdkBin -Filter rc.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK rc.exe not found' }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Rust MSVC target
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Compile Windows workspace
        run: cargo build --locked --workspace --target x86_64-pc-windows-msvc
      # No service installation, driver staging, takeover, or hardware access
      # on hosted runners. Hardware recovery acceptance remains a host step.
