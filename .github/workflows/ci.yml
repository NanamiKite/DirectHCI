name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Format and portable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test portable workspace code
        run: cargo test --locked --workspace

  windows-gnu:
    name: Build Windows GNU binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64 tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64
      - name: Install Rust Windows GNU target
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable
      - name: Build workspace
        run: cargo build --locked --workspace --target x86_64-pc-windows-gnu
