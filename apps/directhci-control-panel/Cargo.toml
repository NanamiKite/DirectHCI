[package]
name = "directhci-control-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
directhci-client.workspace = true
directhci-core.workspace = true
native-windows-gui = { version = "1.0.13", default-features = false, features = ["combobox", "notice", "textbox", "clipboard", "high-dpi", "frame", "embed-resource", "tray-notification", "menu", "cursor"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
