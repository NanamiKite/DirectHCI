[workspace]
members = [
    "apps/directhci",
    "crates/directhci-core",
    "crates/directhci-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
directhci-core = { path = "crates/directhci-core" }
directhci-windows = { path = "crates/directhci-windows" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
windows = "0.62.2"
